name: CI

# Host (Kokkos OpenMP/Serial) CI for peclet.flow — suite/docs/QUALITY_PLAN.md §3.D ("CI that is honest"):
#   * build-test : the single-rank module + the 44 kernel ctests (tests/kokkos) + the D3 env-knob guard
#                  + the accuracy/efficiency regression suite + the three canonical verify scripts, all
#                  from ONE tree built with
#                  -DPECLET_FLOW_BUILD_TESTS=ON. `ctest -LE bench` — the `bench`-labelled timing instruments
#                  (vof_timing, bench_rbgs) are listed by `ctest -N` but not run here.
#   * mpi        : the same tree with -DPECLET_FLOW_MPI=ON; the 106 distributed ctests at np = 1 and 2 on
#                  the 4-core runner (np = 4 and the np = 8 rung with oversubscription only when the np = 2
#                  pass stayed under 20 min — the step says so either way).
#                  A last configure-only step fetches core at the DEFAULT PECLET_CORE_TAG (the release
#                  pin) so an unfetchable pin fails here rather than in the release's sdist build.
# The hosted runners have 4 cores / 16 GB: every job bounds the OpenMP pool (OMP_NUM_THREADS) and runs
# ctest -j1 — an unbounded pool starved the runner ("The hosted runner lost communication").
# GPU (CUDA/HIP) backends are not exercisable on free runners; they are covered by the local trees.

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

env:
  KOKKOS_TAG: "5.1.1"        # keep in lockstep with ../tools/bootstrap_deps.sh + cmake/PecletDeps.cmake
  NANOBIND_VERSION: "2.13.0" # pinned CI input (the wheel build pins its own via pyproject.toml)

jobs:
  build-test:
    name: single-rank (kernel ctests + regression + verify)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OMP_PROC_BIND: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev python3-dev python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install "nanobind==${NANOBIND_VERSION}" numpy

      - name: Cache Kokkos install
        id: kokkos-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/kokkos-install
          key: kokkos-${{ env.KOKKOS_TAG }}-openmp-${{ runner.os }}

      - name: Build Kokkos (OpenMP + Serial)
        if: steps.kokkos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$KOKKOS_TAG" https://github.com/kokkos/kokkos.git /tmp/kokkos
          cmake -S /tmp/kokkos -B /tmp/kokkos/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DKokkos_ENABLE_OPENMP=ON -DKokkos_ENABLE_SERIAL=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/kokkos-install"
          cmake --build /tmp/kokkos/build -j
          cmake --install /tmp/kokkos/build

      - name: Configure + build (module + tests/kokkos, core main)
        run: |
          # main builds against core's main (the default PECLET_CORE_TAG is the last core release,
          # which lags the headers main already uses; the configure-only step below checks that pin).
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/kokkos-install" \
            -DPECLET_CORE_TAG=main \
            -DPECLET_FLOW_BUILD_TESTS=ON
          cmake --build build -j
          ctest --test-dir build -N

      - name: Import smoke test
        run: PYTHONPATH=$PWD/build python3 -c "import peclet.flow; print('peclet.flow import OK')"

      - name: Kernel ctests + quality guards (tests/kokkos, -LE bench)
        run: ctest --test-dir build -j1 --timeout 1200 --output-on-failure -LE bench -E '^(regression_|verify_)'

      - name: Regression suite + verify scripts (Python, on the built module)
        run: ctest --test-dir build -j1 --timeout 3600 --output-on-failure -R '^(regression_|verify_)'

      - name: Configure against the DEFAULT PECLET_CORE_TAG (the release pin), configure only
        run: |
          # No -DPECLET_CORE_TAG: cmake/PecletDeps.cmake's default is the core tag a release sdist /
          # wheel fetches, so this catches a pin that does not exist or cannot be fetched. It is
          # CONFIGURE ONLY: flow main already includes core headers newer than the pinned release
          # (2026-09-08: v0.6.1 lacks VofMetric / vofPhysNormal from the anisotropic-cells work), so
          # a compile here would be red until the release pre-flight re-pins (QUALITY_PLAN.md D4).
          grep -n 'set(PECLET_CORE_TAG' cmake/PecletDeps.cmake
          cmake -S . -B build_pin -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/kokkos-install"

  mpi:
    name: mpi (tests/kokkos_mpi np=1,2[,4,8])
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OMP_PROC_BIND: "false"
      # OpenMPI 4.x: allow more ranks than cores (the np=4 / np=8 rungs on the 4-core runner).
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (+ OpenMPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev python3-dev python3-pip \
            libopenmpi-dev openmpi-bin
          python3 -m pip install --upgrade pip
          python3 -m pip install "nanobind==${NANOBIND_VERSION}" numpy
          mpirun --version

      - name: Cache Kokkos install
        id: kokkos-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/kokkos-install
          key: kokkos-${{ env.KOKKOS_TAG }}-openmp-${{ runner.os }}

      - name: Build Kokkos (OpenMP + Serial)
        if: steps.kokkos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$KOKKOS_TAG" https://github.com/kokkos/kokkos.git /tmp/kokkos
          cmake -S /tmp/kokkos -B /tmp/kokkos/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DKokkos_ENABLE_OPENMP=ON -DKokkos_ENABLE_SERIAL=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/kokkos-install"
          cmake --build /tmp/kokkos/build -j
          cmake --install /tmp/kokkos/build

      - name: Configure + build (module + tests/kokkos_mpi, core main)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/kokkos-install" \
            -DPECLET_CORE_TAG=main \
            -DPECLET_FLOW_MPI=ON -DPECLET_FLOW_BUILD_TESTS=ON \
            -DMPIEXEC_EXECUTABLE=/usr/bin/mpirun
          cmake --build build -j
          ctest --test-dir build -N -R '_np[0-9]+$'

      - name: MPI ctests np=1
        run: ctest --test-dir build -j1 --timeout 1200 --output-on-failure -R '_np1$'

      - name: MPI ctests np=2
        id: np2
        run: |
          t0=$(date +%s)
          ctest --test-dir build -j1 --timeout 1200 --output-on-failure -R '_np2$'
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"

      - name: MPI ctests np=4 (+ the np=8 rung), oversubscribed
        if: ${{ fromJSON(steps.np2.outputs.seconds) < 1200 }}
        run: ctest --test-dir build -j1 --timeout 1200 --output-on-failure -R '_np[48]$'

      - name: MPI ctests np=4 NOT run
        if: ${{ fromJSON(steps.np2.outputs.seconds) >= 1200 }}
        run: |
          echo "::warning::np=2 pass took ${{ steps.np2.outputs.seconds }} s (>= 1200): the np=4 / np=8 rungs were NOT run on this runner"
